services:
  control-plane:
    image: keeps-server:local
    build:
      context: ../..
      dockerfile: server/Dockerfile
    container_name: keeps-control-plane
    restart: unless-stopped
    cpuset: ${KEEPS_CPUSET:-2-3}
    mem_limit: ${KEEPS_MEMORY_LIMIT:-2g}
    memswap_limit: ${KEEPS_MEMORY_LIMIT:-2g}
    ports:
      - "127.0.0.1:2283:2283"
    environment:
      KEEPS_ACCESS_TOKEN: ${KEEPS_ACCESS_TOKEN:?Set KEEPS_ACCESS_TOKEN to a random secret of at least 32 bytes}
      CONTROL_PLANE_AUTO_CREATE_SCHEMA: ${CONTROL_PLANE_AUTO_CREATE_SCHEMA:-1}
      CONTROL_PLANE_PUBLIC_BASE_URL: ${CONTROL_PLANE_PUBLIC_BASE_URL}
      KEEPS_ROOT: /keeps
      ORIGINAL_ROOT: /volume2/photo
      KEEPS_THUMBNAIL_QUALITY: ${KEEPS_THUMBNAIL_QUALITY:-50}
      KEEPS_CACHE_GC_ENABLED: ${KEEPS_CACHE_GC_ENABLED:-0}
      KEEPS_LOCAL_CACHE_ENCODING_ENABLED: ${KEEPS_LOCAL_CACHE_ENCODING_ENABLED:-1}
      TZ: ${TZ:-America/New_York}
      KEEPS_LIBRARY_ID: ${KEEPS_LIBRARY_ID:-local-library}
      KEEPS_SCAN_INTERVAL_SECONDS: ${KEEPS_SCAN_INTERVAL_SECONDS:-300}
    volumes:
      - ${KEEPS_ROOT}:/keeps
      - ${ORIGINAL_ROOT}:/volume2/photo:rw
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:2283/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 930s
